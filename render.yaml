# Render Blueprint. Free plan works but /data resets on each deploy;
# the Starter plan keeps the disk (accounts, shows, feedback in podsen_v2.db).
#
# Untested since the move to the V2 app: running locally behind a cloudflared tunnel
# (see README) is the verified setup. All V2 data is one SQLite file on the disk below,
# so keep a single instance unless the database moves somewhere shared.
services:
  - type: web
    name: podsen
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # --timeout 300: a first "today" run fetches every saved feed while the user waits.
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 300 app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      # Only for the v1_llm evaluation baseline; the app runs without it.
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: podsen-data
      mountPath: /data
      sizeGB: 1
