app = "podsen"
primary_region = "iad"

[build]

[env]
  FLASK_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"

  # Untested since the move to the V2 app: running locally behind a cloudflared tunnel
  # (see README) is the verified setup. Set secrets with `fly secrets set`:
  #   SESSION_SECRET and ADMIN_KEY (required), GROQ_API_KEY (only for the v1_llm
  #   evaluation baseline). All V2 data is one SQLite file on the /data mount.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "podsen_data"
  destination = "/data"
